<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc">
  <title id="title">Swabir Mohammed — Secure by design</title>
  <desc id="desc">A dark navy banner with a cyan terminal-inspired grid and the text software engineering student, security-minded builder.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#08131f"/>
      <stop offset="1" stop-color="#101f32"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#48e0d0"/>
      <stop offset="1" stop-color="#56a8ff"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#87b7d1" stroke-opacity=".07" stroke-width="1"/>
    </pattern>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1200" height="300" rx="24" fill="url(#background)"/>
  <rect width="1200" height="300" rx="24" fill="url(#grid)"/>
  <path d="M0 245H1200" stroke="#48e0d0" stroke-opacity=".2"/>
  <path d="M760 300 940 0M895 300 1075 0M1030 300 1210 0" stroke="#56a8ff" stroke-opacity=".08" stroke-width="1"/>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
    <text x="82" y="83" fill="#48e0d0" font-size="15" letter-spacing="3">SOFTWARE ENGINEERING  /  CYBERSECURITY</text>
    <text x="78" y="157" fill="#f1f7fb" font-size="56" font-weight="700" letter-spacing="-2">SWABIR MOHAMMED</text>
    <rect x="82" y="191" width="5" height="31" rx="2" fill="url(#accent)" filter="url(#glow)"/>
    <text x="104" y="213" fill="#b7c9d8" font-size="21">Building thoughtful software, with security in mind.</text>
    <text x="82" y="273" fill="#48e0d0" font-size="14" letter-spacing="2">APPSEC-INTERESTED  ·  ALWAYS LEARNING</text>
  </g>

  <g transform="translate(1010 90)" fill="none" stroke="url(#accent)" stroke-width="2">
    <path d="M0 28 46 8l46 20v46c0 31-21 52-46 66C21 126 0 105 0 74Z" stroke-opacity=".75"/>
    <path d="m29 70 12 12 24-27" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="46" cy="74" r="64" stroke-opacity=".14"/>
  </g>
</svg>
