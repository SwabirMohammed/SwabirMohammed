<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="290" viewBox="0 0 1400 290" role="img" aria-labelledby="title desc">
  <title id="title">Swabir M. Swabir</title>
  <desc id="desc">A warm, typography-led banner. Swabir M. Swabir builds tools that make complex workflows clearer, more useful, and more secure. On the right, three wandering lines converge into one clear path.</desc>
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7f3ea"/>
      <stop offset="1" stop-color="#eee8dc"/>
    </linearGradient>
    <clipPath id="rounding"><rect width="1400" height="290" rx="22"/></clipPath>
  </defs>

  <g clip-path="url(#rounding)">
    <rect width="1400" height="290" fill="url(#paper)"/>
    <path d="M80 254H1320" stroke="#cfc5b5" stroke-width="1"/>
    <path d="M80 253H170" stroke="#a64f2b" stroke-width="3"/>

    <g font-family="Inter, ui-sans-serif, system-ui, Arial, sans-serif">
      <text x="80" y="55" fill="#92502f" font-size="16" font-weight="650" letter-spacing="3">SOFTWARE ENGINEERING  /  CYBERSECURITY</text>
      <text x="74" y="143" fill="#20252a" font-family="Georgia, 'Times New Roman', serif" font-size="78" font-weight="700" letter-spacing="-1.5">SWABIR M. SWABIR</text>
      <text x="80" y="190" fill="#3b4650" font-size="25" font-weight="450">I build tools that make complex workflows clearer,</text>
      <text x="80" y="222" fill="#3b4650" font-size="25" font-weight="450">more useful, and more secure.</text>
    </g>

    <g fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M930 97C1003 97 999 205 1060 164C1086 146 1103 145 1125 145" stroke="#a64f2b" stroke-width="2.5" stroke-opacity=".55"/>
      <path d="M930 145C986 145 1018 94 1064 134C1087 154 1104 145 1125 145" stroke="#a64f2b" stroke-width="2.5" stroke-opacity=".72"/>
      <path d="M930 193C996 193 1013 134 1065 153C1089 162 1105 145 1125 145" stroke="#a64f2b" stroke-width="2.5" stroke-opacity=".9"/>
      <path d="M1125 145C1172 145 1231 145 1302 145" stroke="#20252a" stroke-width="3"/>
    </g>
  </g>
</svg>
